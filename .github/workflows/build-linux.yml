name: Build Linux bridge

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
      - 'diag/**'
    paths: ['rust/**', 'java/**', 'proto/**', 'Cargo.*', '.github/workflows/build-linux.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-bridge
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/diag/playasia-jvm-core-dump' || github.ref == 'refs/heads/master' }}

      - name: Install protobuf + mold
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang
          mold --version || true

      - name: Build Java bridge
        working-directory: java
        run: ./gradlew --no-daemon --no-configuration-cache jar

      - name: Build native bridge
        working-directory: rust
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: |
          sccache --start-server || true
          cargo build --release --locked --jobs 2 --verbose
          sccache --show-stats || true

      - name: Collect diagnostics
        if: always()
        run: |
          ls -lh java/patchbukkit/build/libs/ rust/target/release/libpatchbukkit.so 2>&1 || true
          sccache --show-stats || true

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchbukkit-linux-${{ github.sha }}
          path: |
            rust/target/release/libpatchbukkit.so
            java/patchbukkit/build/libs/patchbukkit.jar
            java/patchbukkit-test-plugin/build/libs/patchbukkit-test-plugin.jar
          retention-days: 7
