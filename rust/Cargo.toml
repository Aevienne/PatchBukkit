[package]
name = "patchbukkit"
version = "0.1.0"
edition = "2024"
authors = ["PumpkinMC Contributors"]
description = "Compatibility layer for running Bukkit, Spigot, and Paper plugins on Pumpkin"

build = "build/main.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to a rev matching the Pumpkin DEV binary (built 2026-09-01).
# The bridge reads Pumpkin's Server/Config structs by offset: any struct
# drift (e.g. LoggingConfig +4 fields on 2026-08-30) segfaults the first
# FFI call (exit 139, no hs_err). Keep in sync with the deployed binary;
# verify with the layout check in docs before bumping.
pumpkin = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "99989ba3b6a292fcdf36473065e4d365b6f89928", package = "pumpkin" }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "99989ba3b6a292fcdf36473065e4d365b6f89928", package = "pumpkin-data" }
pumpkin-protocol = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "99989ba3b6a292fcdf36473065e4d365b6f89928", package = "pumpkin-protocol" }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "99989ba3b6a292fcdf36473065e4d365b6f89928", package = "pumpkin-util" }
pumpkin-config = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "99989ba3b6a292fcdf36473065e4d365b6f89928", package = "pumpkin-config" }
pumpkin-api-macros = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "99989ba3b6a292fcdf36473065e4d365b6f89928", package = "pumpkin-api-macros" }

tokio = "1"
tracing = "0.1"
glob = "0.3.4"
jni = { version = "0.22.4", features = ["invocation"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
walkdir = "2"
zip = "8.6"

anyhow = "1.0"
uuid = "1.25.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.1.0"

rand = { git = "https://github.com/rust-random/rand"}
prost = "0.14"
time = "0.3"

toml = "1.1"

[build-dependencies]
env_logger = "0.11.11"
log = "0.4"
prost-build = "0.14"
protoc-bin-vendored = "3"
glob = "0.3"

[profile.release]
lto = true

[lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
# nursery = { level = "deny", priority = -1 }
# pedantic = { level = "deny", priority = -1 }
# cargo = { level = "deny", priority = -1 }

multiple_crate_versions = "allow"
unnecessary_fallible_conversions = "allow"
not_unsafe_ptr_arg_deref = "allow" # Not sure about this one
